# Quality gate for a SwiftUI app (agent-ios-swiftui), as a reusable workflow. The stack plugin's
# setup installs a small caller in the user's repo (.github/workflows/quality-gate.y*ml). Anyone can
# call it the same way from a pull_request workflow, pinned to one commit of agent-config-kit:
#
#     on:
#       pull_request:
#     permissions:
#       contents: read
#     jobs:
#       quality-gate:
#         permissions:
#           contents: read
#         uses: adhibuchori/agent-config-kit/.github/workflows/ios-swiftui-quality-gate.yml@<40-hex sha> # v1.3.0
#         with: # every input is optional
#           scheme: MyApp
#
# Three jobs (actions/quality-gate/scripts/stacks/ios-swiftui.sh, phases static and build):
#   static  Linux, about a minute: the gates.list lines that need no Mac (the Node and bash
#           checks), a committed .env, gitleaks over the pull request's commits, SkillSpector when a
#           skill, command, subagent or hook changed. SwiftLint waits for macOS: swiftlint-static
#           aborts on a custom rule.
#   build   macOS, only after static passed (a failure that needs no Mac never pays macOS minutes):
#           the pinned Xcode, the whole gates.list (swift-format, SwiftLint, swift test with
#           coverage, the project checks), the coverage floor, xcodebuild build-for-testing for the
#           newest iOS simulator with zero build warnings, the string catalog checks that need a
#           build, Periphery, the API client regenerated with no diff, and last the scheme's tests
#           (xcodebuild test-without-building), so a failing or timed-out test hides nothing. Name a
#           scheme that selects the quick UI tests (`scheme:`); a full accessibility audit of every
#           screen outlasts a hosted macOS runner and belongs on a developer's simulator.
#   gate    passes only when both did. Require this one check, "Quality Gate (ios-swiftui)": a job
#           skipped because the one before it failed does not block a merge by itself.
# A check that cannot run fails the gate unless strict is false.
#
# The macOS runner is the `xcode-27` label unless the caller's repository sets CI_RUNNER_MACOS (or
# passes runs-on). Xcode is chosen with DEVELOPER_DIR, never sudo xcode-select, and the build fails
# when the runner's Xcode is not xcode-version.
#
# Pinning: the steps below name the action as $/actions/quality-gate, GitHub's self-repository
# form. It resolves to this repository at the commit this workflow file was loaded from, so the
# caller's SHA pin covers this file, the action and every script it runs; nothing moves until the
# caller changes its pin. It needs github.com with runner 2.336.0 or newer (GitHub-hosted runners
# are); GitHub Enterprise Server does not support it. actionlint 1.7.12 does not know the form yet,
# so .github/actionlint.yaml ignores that one message for the eight *-quality-gate.yml files.
#
# Permissions: contents: read only. No secret is needed; nothing is pushed, uploaded or signed, and
# the checkouts keep no token.
name: Quality Gate (ios-swiftui)

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: Minimum line and function coverage (0-100) of the logic package, read from coverage/lcov.info; 0 turns the floor off.
        type: number
        required: false
        default: 100
      env-file:
        description: A committed *.example file of dummy KEY=VALUE variables the tests need. Never real secrets.
        type: string
        required: false
        default: .env.ci.example
      xcode-version:
        description: The Xcode the build uses, from /Applications/Xcode_<version>.app; the build fails when xcodebuild -version says another.
        type: string
        required: false
        default: '27.0'
      scheme:
        description: The Xcode scheme to build and test; empty uses the project's name.
        type: string
        required: false
        default: ''
      node-version:
        description: Node.js version. The kit checks in scripts/check/*.mjs need it.
        type: string
        required: false
        default: '22'
      base-ref:
        description: The branch the diff checks compare against; empty uses the pull request's base (github.base_ref).
        type: string
        required: false
        default: ''
      runs-on:
        description: macOS runner label for the build job; empty uses the caller repository's CI_RUNNER_MACOS, then xcode-27.
        type: string
        required: false
        default: ''
      static-runs-on:
        description: Linux runner label for the static job and the final check; empty uses the caller repository's CI_RUNNER_FAST, then CI_RUNNER, then ubuntu-latest.
        type: string
        required: false
        default: ''
      timeout-minutes:
        description: Timeout of the macOS build job in minutes.
        type: number
        required: false
        default: 40
      strict:
        description: Fail the gate when a check could not run (no gitleaks, no coverage report, no gates.list).
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  static:
    name: Quality Gate (ios-swiftui, static)
    # The job a developer waits on takes the fast pool first; vars come from the caller's repo.
    runs-on: ${{ inputs.static-runs-on || vars.CI_RUNNER_FAST || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Full history: the diff checks compare the pull request with its base branch.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Quality Gate (static)
        uses: $/actions/quality-gate
        with:
          stack: ios-swiftui
          phase: static
          base-ref: ${{ inputs.base-ref || github.base_ref }}
          coverage-threshold: ${{ inputs.coverage-threshold }}
          env-file: ${{ inputs.env-file }}
          node-version: ${{ inputs.node-version }}
          strict: ${{ inputs.strict }}

  build:
    name: Quality Gate (ios-swiftui, build and test)
    needs: static
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER_MACOS || 'xcode-27' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Quality Gate (build and test)
        uses: $/actions/quality-gate
        with:
          stack: ios-swiftui
          phase: build
          base-ref: ${{ inputs.base-ref || github.base_ref }}
          coverage-threshold: ${{ inputs.coverage-threshold }}
          env-file: ${{ inputs.env-file }}
          xcode-version: ${{ inputs.xcode-version }}
          scheme: ${{ inputs.scheme }}
          node-version: ${{ inputs.node-version }}
          strict: ${{ inputs.strict }}

  gate:
    name: Quality Gate (ios-swiftui)
    if: ${{ always() }}
    needs: [static, build]
    runs-on: ${{ inputs.static-runs-on || vars.CI_RUNNER_FAST || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      # A job skipped or cancelled is not a pass: both results must be success.
      - name: Both jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
