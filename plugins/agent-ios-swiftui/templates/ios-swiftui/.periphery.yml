# Periphery's settings for the dead-code check (AGENTS.md Rule 27). The quality gate's macOS job runs
# `periphery scan --strict` over the index its test build wrote, and fails on any declaration nothing
# in the scheme uses. Put your project's file name and scheme in place of <App>: setup cannot know
# them. Setup created this file once; it is yours now.
project: <App>.xcodeproj
schemes:
  - <App>
# Generated code holds what the spec declares, used or not.
report_exclude:
  - "**/GeneratedSources/**"
# The seeded problem type is the contract with the backend: the generated client decodes into it
# from the first spec copy, and screens use its members as they appear.
retain_files:
  - "**/APIClient/AppProblem.swift"
