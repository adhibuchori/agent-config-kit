# React Doctor: security, performance, correctness, accessibility and architecture findings for the
# site's React code, as review comments on the changed lines, one summary comment and a commit
# status. Advisory only: it never fails the check. Installed by /agent-fe-nextjs-static:setup when
# you answer react-doctor=yes; it reads doctor.config.json.
#
# The vendor's action runs the CLI with its defaults, which report diagnostics to the vendor's score
# service. Nobody waits on an advisory check, so it runs on CI_RUNNER, then ubuntu-latest.

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, prod, main, master]

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read # scan the checked-out code
      pull-requests: write # inline review comments on the changed lines
      issues: write # the sticky summary comment on the pull request
      statuses: write # the commit status with the score
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          # An exact CLI release: the default, `latest`, runs whatever npm serves that day.
          # Raise it together with the action pin.
          version: 0.9.14
