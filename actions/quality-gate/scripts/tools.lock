# The tools the quality gate installs for the be-go, be-axum and ios-swiftui stacks: one exact
# release each, read by install-release.sh. Every sha256 is the digest the release's own page lists
# (the GitHub release asset digest, which matches the project's checksums file where it ships one).
#
# Columns, separated by spaces: tool, version, platform (linux-x64, linux-arm64, darwin-arm64,
# darwin-x64, or any), format, sha256, source, member.
#   format bin     source is the binary itself; member is unused (-)
#   format tar.gz  source is an archive; member is the path of the binary inside it, then (comma-
#                  separated) any file the binary loads from its own folder
#   format zip     the same, for a zip archive
#   format cargo   built from crates.io with `cargo install --locked` (no official binary exists);
#                  source is the crate, member its features (default features off); cargo checks
#                  every crate against the registry's own checksum
# A tool installs as its own name (swiftlint-static becomes swiftlint). A platform with no row for a
# tool gets none: the check that needs it then records that it did not run.
#
# To move a pin: replace the version and every sum of that tool in one pull request, from the new
# release's page, and run bats tests/ci/install-release.bats.

